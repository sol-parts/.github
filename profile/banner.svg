<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Sol.parts — solutions for selling auto parts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0719"/>
      <stop offset="55%" stop-color="#1A0E2E"/>
      <stop offset="100%" stop-color="#2A1150"/>
